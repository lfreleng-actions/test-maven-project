# Version components, kept in the flat form used by Linux Foundation
# release tooling (the values feed build metadata detection, so they
# cannot be nested keys such as version.release).

major=1
minor=0
patch=0

base_version=${major}.${minor}.${patch}

release_version=${base_version}
snapshot_version=${base_version}-SNAPSHOT
