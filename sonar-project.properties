# Configuration for the SonarQube Scanner CLI.
#
# Maven analysis mode does NOT read this file: sonar-maven-plugin derives
# sources, tests, binaries and coverage paths from the Maven project
# model. The properties below exist so the CLI scanner, which has no such
# model, can analyse this project too. Keeping both paths working is the
# point of this fixture.

sonar.organization=lfreleng-actions
sonar.projectKey=test-maven-project
sonar.projectName=test-maven-project

# .gitignore hides target/, which would otherwise exclude the compiled
# classes the Java analyser needs.
sonar.scm.exclusions.disabled=true

sonar.sources=core/src/main/java,app/src/main/java
sonar.tests=core/src/test/java,app/src/test/java

sonar.java.binaries=core/target/classes,app/target/classes
sonar.java.test.binaries=core/target/test-classes,app/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=core/target/site/jacoco/jacoco.xml,app/target/site/jacoco/jacoco.xml

sonar.java.source=17
sonar.sourceEncoding=UTF-8
